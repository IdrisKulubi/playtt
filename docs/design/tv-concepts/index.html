<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayTT TV concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #f4fbff; color: #041019; font-family: "Space Grotesk", system-ui, sans-serif; padding: 48px 4vw 80px; }
  header { max-width: 1400px; margin: 0 auto 36px; }
  h1 { font-size: 40px; letter-spacing: -.03em; }
  header p { margin-top: 8px; color: rgba(4,16,25,.62); font-size: 17px; max-width: 80ch; }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; gap: 44px; }
  figure { display: grid; gap: 14px; }
  .frame { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 90, 170, .18); }
  iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
  figcaption { display: flex; justify-content: space-between; gap: 24px; align-items: baseline; }
  figcaption b { font-size: 22px; white-space: nowrap; }
  figcaption span { color: rgba(4,16,25,.62); font-size: 16px; max-width: 64ch; text-align: right; }
  .n { font-family: "Geist Mono", monospace; color: #0090d9; margin-right: 10px; font-size: 15px; letter-spacing: .1em; }
  a { color: #0090d9; }
</style>
</head>
<body>
<header>
  <h1>Venue TV · five bright concepts</h1>
  <p>Built for a lit, open room: brand azure #00b7ff is the hero, with white, ice, sky and cobalt tints. Each shows the live session text on top. Open one full screen with the link under it; press 1-5 to switch, H to hide the text. The earlier dark set is in <a href="dark/index.html">dark/</a>.</p>
</header>
<div class="grid">
  <figure><div class="frame"><iframe src="concept.html?c=1" title="Azure Bloom"></iframe></div>
    <figcaption><b><span class="n">01</span>Azure Bloom</b><span>Saturated azure with soft white light blooming through it, like sun through water. Big, bright, unmistakably PlayTT blue. <a href="concept.html?c=1">Full screen</a></span></figcaption></figure>
  <figure><div class="frame"><iframe src="concept.html?c=2" title="Sky Layers"></iframe></div>
    <figcaption><b><span class="n">02</span>Sky Layers</b><span>Layered waves roll slowly from an ice-white sky down to deep azure, each crest catching light. A macOS-wallpaper feel. <a href="concept.html?c=2">Full screen</a></span></figcaption></figure>
  <figure><div class="frame"><iframe src="concept.html?c=3" title="Liquid Glass"></iframe></div>
    <figcaption><b><span class="n">03</span>Liquid Glass</b><span>Frosted glass spheres drift over the azure field; the colour bends through them as they pass. Apple's liquid-glass language. <a href="concept.html?c=3">Full screen</a></span></figcaption></figure>
  <figure><div class="frame"><iframe src="concept.html?c=4" title="Silk"></iframe></div>
    <figcaption><b><span class="n">04</span>Silk</b><span>A wide azure ribbon folds and turns across a white field, lit like fabric. Elegant, airy, very photogenic. <a href="concept.html?c=4">Full screen</a></span></figcaption></figure>
  <figure><div class="frame"><iframe src="concept.html?c=5" title="Rally Ripples"></iframe></div>
    <figcaption><b><span class="n">05</span>Rally Ripples</b><span>A light bounces between two points in a rally rhythm; every landing sends azure rings across bright ice, overlapping like water. <a href="concept.html?c=5">Full screen</a></span></figcaption></figure>
</div>
<script>
  const fit = () => document.querySelectorAll(".frame").forEach((f) => {
    f.querySelector("iframe").style.transform = `scale(${f.clientWidth / 1920})`
  })
  addEventListener("resize", fit)
  fit()
</script>
</body>
</html>
