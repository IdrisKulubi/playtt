<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlayTT story</title>
<style>
@font-face { font-family: SG; src: url(assets/space-grotesk-500.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: SG; src: url(assets/space-grotesk-700.woff2) format("woff2"); font-weight: 700; }
html, body { margin: 0; background: #000; }
#stage { display: block; width: 1080px; height: 1920px; }
#hud { position: fixed; left: 12px; bottom: 12px; font: 14px/1.4 monospace; color: #92a6bf; background: #0b1627cc; padding: 6px 10px; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="hud">Space play/pause · ←/→ frame · R replay · <span id="tc">0.000</span></div>
<script>
// PlayTT cartoon story, 22 s, 9:16. Pure function of t inside seek(t). Music drop (film 16.0) = the around-the-net shot lands.
const W = 1080, H = 1920, T = 22, FPS = 60;
const C = { blue: "#00b7ff", cobalt: "#2b4ee0", lime: "#c6f432", pink: "#ff4fa3", violet: "#8b5cf6", sun: "#ffd23f", coral: "#ff5a5f",
  lilac: "#ece6ff", navy: "#07111d", ink: "#101828", night: "#24175e", white: "#ffffff", muted: "#8a94a8", red: "#ff3b30",
  tableTop: "#0d4a6b", wood: "#c68b59", rubber: "#e63946" };
const KEVO = { skin: "#7a4a26", hair: "#141414", shirt: C.blue, shorts: C.ink, sole: C.lime, style: "crop" };
const SHIRU = { skin: "#a2683c", hair: "#1a1210", shirt: C.pink, shorts: C.violet, sole: C.sun, style: "puffs" };
const cv = document.getElementById("stage"), ctx = cv.getContext("2d");

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const out3 = k => 1 - Math.pow(1 - k, 3);
const io = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function sp(t, f = 2.0, z = 0.78) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const pop = (t, a, f = 2.6) => sp(t - a, f, 0.62);              // entrance with a playful overshoot
const bump = (t, a, d = 0.12, f = 3.2) => sp(t - a, f, 0.8) - sp(t - a - d, f, 0.8);
const gauss = (t, a, w) => Math.exp(-(((t - a) / w) ** 2));
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((x, i) => Math.round(lerp(x, B[i], clamp(k)))).join(",")})`; }
const rgba = (c, a) => { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ell(x, y, a, b, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, a), Math.max(0, b), 0, 0, 7); ctx.fill(); }
function text(s, x, y, size, color, weight = 700, align = "left", ls = 0) {
  ctx.font = `${weight} ${size}px SG`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.letterSpacing = `${ls}px`; ctx.fillText(s, x, y); ctx.letterSpacing = "0px";
}
function tw(s, size, weight = 700) { ctx.font = `${weight} ${size}px SG`; return ctx.measureText(s).width; }
function wrap(s, maxW, size, weight = 700) {
  const out = []; let line = "";
  for (const w of s.split(" ")) { const tryL = line ? line + " " + w : w; if (tw(tryL, size, weight) > maxW && line) { out.push(line); line = w; } else line = tryL; }
  out.push(line); return out;
}
function bg(col) { ctx.fillStyle = col; ctx.fillRect(-200, -200, W + 400, H + 400); }
function scaleAt(x, y, k) { ctx.translate(x, y); ctx.scale(k, k); ctx.translate(-x, -y); }
function tap(t, x, y, a) {                                       // touch ripple
  const k = seg(t, a, a + 0.38);
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalAlpha = 0.9 * (1 - k);
  circle(x, y, 30 * (1 - 0.3 * k), rgba("#ffffff", 0.45));
  ctx.lineWidth = 5; ctx.strokeStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x, y, 30 + 56 * out3(k), 0, 7); ctx.stroke();
  ctx.restore();
}
function check(x, y, s, d, col, lw) {
  if (d <= 0) return;
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash([2.2 * s * d, 4 * s]); ctx.beginPath();
  ctx.moveTo(x - 0.55 * s, y); ctx.lineTo(x - 0.15 * s, y + 0.4 * s); ctx.lineTo(x + 0.6 * s, y - 0.45 * s); ctx.stroke(); ctx.setLineDash([]);
}
function sparkle(x, y, r, col) {
  if (r <= 0.5) return;
  ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr2 = i % 2 ? r * 0.28 : r; ctx.lineTo(x + Math.sin(a) * rr2, y - Math.cos(a) * rr2); }
  ctx.closePath(); ctx.fill();
}
function heart(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.3, y, x - s * 0.9, y - s * 1.1, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.9, y - s * 1.1, x + s * 1.3, y, x, y + s * 0.9); ctx.fill();
}
function flame(x, y, s) {
  ctx.fillStyle = C.coral; ctx.beginPath(); ctx.moveTo(x, y - s * 1.2);
  ctx.bezierCurveTo(x + s * 0.9, y - s * 0.3, x + s * 0.9, y + s * 0.8, x, y + s * 0.8);
  ctx.bezierCurveTo(x - s * 0.9, y + s * 0.8, x - s * 0.9, y - s * 0.1, x - s * 0.2, y - s * 0.6);
  ctx.quadraticCurveTo(x - s * 0.1, y - s * 0.2, x, y - s * 1.2); ctx.fill();
  ctx.fillStyle = C.sun; ctx.beginPath(); ctx.ellipse(x, y + s * 0.35, s * 0.35, s * 0.42, 0, 0, 7); ctx.fill();
}
// drifting sticker confetti behind each scene (never frozen)
function decor(t, seed, cols, n = 9, zone = [0, 0, W, H]) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = zone[0] + r() * zone[2], y = zone[1] + r() * zone[3], col = cols[i % cols.length], kind = i % 3, ph = r() * 6, sz = 18 + r() * 22;
    const dx = Math.sin(t * 1.3 + ph) * 10, dy = Math.cos(t * 1.1 + ph) * 12, rot = t * 0.6 + ph;
    ctx.save(); ctx.translate(x + dx, y + dy); ctx.rotate(rot);
    if (kind === 0) sparkle(0, 0, sz, col);
    else if (kind === 1) { ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.beginPath(); for (let j = 0; j <= 12; j++) ctx.lineTo(-sz * 1.3 + j * sz * 0.22, Math.sin(j * 1.2) * 9); ctx.stroke(); }
    else { ctx.strokeStyle = col; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, sz * 0.6, 0, 7); ctx.stroke(); }
    ctx.restore();
  }
}
function blink(t, seed) {
  const per = 2.6 + seed * 0.7, ph = (t + seed * 1.37) % per;
  return ph < 0.13 ? 1 - 0.9 * Math.sin(Math.PI * ph / 0.13) : 1;
}

// ---------- characters (flat, rounded, rubber-hose arms) ----------
// o: x,y = feet (global), s scale, flip faces left. Arms: armL/armR = [shoulder angle, elbow angle] (0 = straight down, + = outward),
// or handL/handR = {x,y} global target solved with two-bone IK. Face: smile -1..1, wow 0..1, sad 0..1, look/lookY eye offset.
const L1 = 86, L2 = 82;
function ik(side, sh, tx, ty, bend = 1) {
  const dx = tx - sh[0], dy = ty - sh[1], d = clamp(Math.hypot(dx, dy), 20, L1 + L2 - 2);
  const th = Math.atan2(side * dx, dy);
  const al = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const ga = Math.acos(clamp((L2 * L2 + d * d - L1 * L1) / (2 * L2 * d), -1, 1));
  return [th + bend * al, -bend * (al + ga)];
}
function paddle(x, y, a, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  rr(-10, -62, 20, 70, 8); ctx.fillStyle = C.wood; ctx.fill();
  circle(0, -104, 50, "#8f1d27"); circle(0, -104, 45, C.rubber);
  ell(-14, -118, 12, 7, rgba("#ffffff", 0.25));
  ctx.restore();
}
function miniPhone(x, y, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  rr(-26, -48, 52, 96, 12); ctx.fillStyle = C.ink; ctx.fill();
  circle(-10, -32, 6, "#2a3448");
  ctx.restore();
}
function hair(o) {
  ctx.fillStyle = o.hair;
  if (o.style === "crop") {
    ctx.beginPath(); ctx.ellipse(0, -18, 76, 64, 0, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fill();
    rr(-74, -32, 14, 30, 6); ctx.fill(); rr(60, -32, 14, 30, 6); ctx.fill();
  } else {
    circle(-66, -66, 44, o.hair); circle(66, -66, 44, o.hair);
    ctx.beginPath(); ctx.ellipse(0, -22, 76, 62, 0, Math.PI * 1.0, Math.PI * 2.0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.sun; rr(-92, -76, 26, 14, 7); ctx.fill();                                     // hair clip
  }
}
function face(o, t) {
  const m = o.smile ?? 0.4, wow = o.wow || 0, sad = o.sad || 0, lx = (o.look || 0) * 12, ly = (o.lookY || 0) * 10;
  const bl = blink(t, o.seed || 0);
  for (const ex of [-26, 26]) {
    ell(ex + lx, -2 + ly, 9 + wow * 2, (12 + wow * 3) * bl, "#141414");
    if (bl > 0.6) circle(ex + lx + 3, -7 + ly, 3.2, "#ffffff");
    const side = Math.sign(ex), by = -26 + ly - wow * 10;
    ctx.strokeStyle = o.hair; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath();
    ctx.moveTo(ex + lx - side * 12, by - sad * 18); ctx.lineTo(ex + lx + side * 12, by + sad * 8); ctx.stroke();
  }
  const y0 = 30 + ly * 0.4, mx = lx * 0.5;
  if (wow > 0.05) { ell(mx, y0 + 4, 10 + 6 * wow, 6 + 14 * wow, "#3a1010"); }
  else {
    if (m > 0.45) { ctx.fillStyle = "#3a1010"; ctx.beginPath(); ctx.moveTo(mx - 22, y0); ctx.quadraticCurveTo(mx, y0 + 34 * m, mx + 22, y0); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = "#141414"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(mx - 20, y0); ctx.quadraticCurveTo(mx, y0 + 28 * m, mx + 20, y0); ctx.stroke();
  }
  if (m > 0.2) { ctx.globalAlpha = clamp((m - 0.2) * 1.6) * 0.55; ell(-44, 18, 13, 8, C.pink); ell(44, 18, 13, 8, C.pink); ctx.globalAlpha = 1; }
}
function person(o, t) {
  const s = o.s || 1, fl = o.flip ? -1 : 1;
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(fl * s, s); if (o.rot) ctx.rotate(o.rot);
  const hipY = -150, shY = -312 + (o.slump || 0) * 12;
  const toLocal = p => [(p.x - o.x) / s * fl, (p.y - o.y) / s];
  // legs + sneakers
  for (const [lx, a] of [[-30, o.legL || 0], [30, o.legR || 0]]) {
    const fx = lx + Math.sin(a) * 140, fy = hipY + Math.cos(a) * 140;
    ctx.strokeStyle = o.skin; ctx.lineWidth = 30; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(lx, hipY); ctx.lineTo(fx, fy); ctx.stroke();
    rr(fx - 26, fy - 6, 62, 30, 15); ctx.fillStyle = "#ffffff"; ctx.fill();
    rr(fx - 26, fy + 14, 62, 10, 5); ctx.fillStyle = o.sole; ctx.fill();
  }
  rr(-66, hipY - 30, 132, 84, 28); ctx.fillStyle = o.shorts; ctx.fill();
  rr(-14, shY - 44, 28, 48, 10); ctx.fillStyle = o.skin; ctx.fill();
  rr(-66, shY - 14, 132, hipY - shY + 14, 52); ctx.fillStyle = o.shirt; ctx.fill();
  circle(30, shY + 44, 11, rgba("#ffffff", 0.85));                                                 // ball logo on the shirt
  // head
  ctx.save(); ctx.translate(0, shY - 104 + (o.headY || 0)); ctx.rotate(o.headTilt || 0);
  circle(-70, 4, 15, o.skin); circle(70, 4, 15, o.skin);
  if (o.style === "puffs") hair(o);
  circle(0, 0, 72, o.skin);
  if (o.style === "crop") hair(o);
  else { ctx.fillStyle = o.hair; ctx.beginPath(); ctx.ellipse(0, -30, 70, 44, 0, Math.PI * 1.0, Math.PI * 2.0); ctx.closePath(); ctx.fill(); }
  face(o, t);
  ctx.restore();
  // arms
  const hands = {};
  for (const side of [-1, 1]) {
    const key = side < 0 ? "L" : "R", sh = [side * 58, shY + 16];
    let ang = o["arm" + key] || [0.12, 0.12];
    if (o["hand" + key]) { const [tx, ty] = toLocal(o["hand" + key]); ang = ik(side, sh, tx, ty, o["bend" + key] ?? 1); }
    const [a1, a2] = ang;
    const el = [sh[0] + side * Math.sin(a1) * L1, sh[1] + Math.cos(a1) * L1];
    const hd = [el[0] + side * Math.sin(a1 + a2) * L2, el[1] + Math.cos(a1 + a2) * L2];
    ctx.strokeStyle = o.skin; ctx.lineWidth = 26; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(sh[0], sh[1]); ctx.quadraticCurveTo(el[0], el[1], hd[0], hd[1]); ctx.stroke();
    ctx.strokeStyle = o.shirt; ctx.lineWidth = 40; ctx.beginPath(); ctx.moveTo(sh[0], sh[1]);
    ctx.lineTo(sh[0] + side * Math.sin(a1) * 34, sh[1] + Math.cos(a1) * 34); ctx.stroke();
    const item = o["item" + key];
    if (item === "paddle") paddle(hd[0], hd[1], o["pad" + key] || 0);
    if (item === "phone") miniPhone(hd[0], hd[1] - 10, o["ph" + key] || 0);
    circle(hd[0], hd[1], 18, o.skin);
    if (item === "thumb") { rr(hd[0] - 8, hd[1] - 46, 17, 40, 8); ctx.fillStyle = o.skin; ctx.fill(); }
    hands[key] = hd;
  }
  ctx.restore();
  return hands;
}
function walk(t, a, b, amp = 0.45) {   // leg swing + bob while moving between a and b
  const v = Math.sin(Math.PI * seg(t, a, b));
  return { legL: Math.sin(t * 13) * amp * v, legR: -Math.sin(t * 13) * amp * v, bob: -Math.abs(Math.sin(t * 13)) * 14 * v };
}

// ---------- narration: a chat bubble that pops from its tail ----------
function bubble(t, s, t0, stamp, opts = {}) {
  const k = pop(t, t0, 2.8);
  if (k < 0.002) return;
  const size = opts.size || 52, pad = 40, maxW = 800, lines = wrap(s, maxW, size);
  const w = Math.max(...lines.map(l => tw(l, size))) + pad * 2 + 10, h = lines.length * size * 1.22 + pad * 2 + 26;
  const x = opts.x ?? 64, y = opts.y ?? 150, col = opts.bg || "#ffffff", fg = opts.fg || C.ink;
  ctx.save(); scaleAt(x, y + h, k); ctx.globalAlpha = clamp(k * 2);
  rr(x, y + 12, w, h, 44); ctx.fillStyle = "rgba(16,24,40,0.16)"; ctx.fill();
  rr(x, y, w, h, 44); ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 18, y + h - 50); ctx.lineTo(x - 14, y + h + 14); ctx.lineTo(x + 80, y + h - 2); ctx.closePath(); ctx.fill();
  lines.forEach((l, i) => {
    const kk = sp(t - t0 - 0.06 - i * 0.07, 3, 0.8);
    ctx.save(); ctx.globalAlpha = clamp(kk * 1.3); text(l, x + pad, y + pad + size * 0.6 + i * size * 1.22 + (1 - kk) * 18, size, fg); ctx.restore();
  });
  text(stamp, x + w - pad - 52, y + h - 30, 26, C.muted, 500, "right");
  check(x + w - pad - 26, y + h - 32, 18, 1, C.blue, 5); check(x + w - pad - 10, y + h - 32, 18, 1, C.blue, 5);
  ctx.restore();
}

// ---------- scene 1 · 0-3.0 · frustration (lilac) ----------
const CARDS = [["Sports club", "Members only", C.violet], ["Community hall", "Closed today", C.sun], ["Office table", "Staff only", C.blue]];
const PHONE1 = [598, 1236];
function scene1(t) {
  bg(C.lilac); decor(t, 11, [C.violet, C.pink, C.blue], 8, [40, 900, 1000, 900]);
  const rise = pop(t, -0.15, 2.2), sad = io(seg(t, 1.8, 2.25));
  ell(540, 1752, 250 * rise, 28, "rgba(36,23,94,0.12)");
  person({ ...KEVO, x: 540, y: 1750 + (1 - rise) * 800, s: 1.6, smile: lerp(0.15, -0.7, sad), sad, slump: sad, look: 0.1, lookY: 0.75,
    headTilt: 0.07 * sad, armR: [0.32, -2.84], itemR: "phone", phR: 0.1, armL: [0.14 + 0.03 * Math.sin(t * 3), 0.1], itemL: "paddle", padL: Math.PI * 1.2, seed: 1 }, t);
  CARDS.forEach(([a, b, col], i) => {
    const k = pop(t, 0.45 + i * 0.5), o = io(seg(t, 1.9 + i * 0.07, 2.25 + i * 0.07));
    if (k < 0.002 || o >= 1) return;
    const x = 150, y = 520 + i * 136, w = 780, hh = 116;
    ctx.save(); ctx.globalAlpha = 1 - o;
    ctx.translate(lerp(0, PHONE1[0] - 540, o), lerp(0, PHONE1[1] - y, o)); scaleAt(540, y + hh / 2, k * (1 - 0.8 * o)); ctx.rotate(0);
    rr(x, y + 8, w, hh, 32); ctx.fillStyle = "rgba(36,23,94,0.12)"; ctx.fill();
    rr(x, y, w, hh, 32); ctx.fillStyle = "#ffffff"; ctx.fill();
    circle(x + 66, y + hh / 2, 36, col);
    rr(x + 48, y + 40, 36, 36, 6); ctx.fillStyle = "#ffffff"; ctx.fill(); rr(x + 60, y + 58, 12, 18, 3); ctx.fillStyle = col; ctx.fill();
    text(a, x + 124, y + 42, 40, C.ink); text(b, x + 124, y + 82, 30, C.muted, 500);
    const st = pop(t, 0.72 + i * 0.5, 3.2);
    if (st > 0.002) {
      ctx.save(); ctx.translate(x + w - 70, y + hh / 2); ctx.rotate((1 - st) * 0.8 - 0.12); ctx.scale(st, st);
      circle(0, 0, 36, C.red); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 9; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-13, -13); ctx.lineTo(13, 13); ctx.moveTo(13, -13); ctx.lineTo(-13, 13); ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  });
  const ck = pop(t, 2.15, 2.4);                                   // rain cloud over his head
  if (ck > 0.002) {
    ctx.save(); scaleAt(540, 830, ck);
    ctx.strokeStyle = C.blue; ctx.lineWidth = 8; ctx.lineCap = "round";
    for (let j = 0; j < 5; j++) { const ph = ((t * 1.6 + j * 0.37) % 1); ctx.globalAlpha = 1 - ph; ctx.beginPath(); ctx.moveTo(470 + j * 35, 860 + ph * 90); ctx.lineTo(462 + j * 35, 890 + ph * 90); ctx.stroke(); }
    ctx.globalAlpha = 1;
    for (const [cx, cy, r] of [[480, 820, 46], [540, 792, 60], [604, 818, 46]]) circle(cx, cy, r, "#8f8aa8");
    rr(440, 812, 210, 56, 28); ctx.fillStyle = "#8f8aa8"; ctx.fill();
    ctx.restore();
  }
  bubble(t, "Where do you even play table tennis around here?", 0.12, "18:41");
}

// ---------- scene 2 · 3.0-6.0 · book (blue) ----------
const P2 = { x: 230, y: 560, w: 620, h: 1180 };
const SLOTS = ["17:00", "18:00", "19:00", "20:00", "21:00", "22:00"];
function p2y(t) { return P2.y + (1 - pop(t, 3.0, 2.2)) * 1100; }
function scene2(t) {
  bg(C.blue); decor(t, 22, [C.lime, "#ffffff", C.sun], 9);
  const y = p2y(t), sx = P2.x + 18, sy = y + 18, sw = P2.w - 36;
  ctx.save(); ctx.translate(P2.x + P2.w / 2, y + P2.h / 2); ctx.rotate(-0.025 * (1 - pop(t, 3.1))); ctx.translate(-(P2.x + P2.w / 2), -(y + P2.h / 2));
  rr(P2.x, y + 18, P2.w, P2.h, 84); ctx.fillStyle = "rgba(4,16,25,0.25)"; ctx.fill();
  rr(P2.x, y, P2.w, P2.h, 84); ctx.fillStyle = C.ink; ctx.fill();
  rr(sx, sy, sw, P2.h - 36, 68); ctx.fillStyle = "#ffffff"; ctx.fill();
  rr(P2.x + P2.w / 2 - 70, sy + 18, 140, 36, 18); ctx.fillStyle = C.ink; ctx.fill();
  text("Today", sx + 40, sy + 110, 32, C.muted, 500); text("Pick a time", sx + 40, sy + 166, 60, C.ink);
  const cw = (sw - 100) / 2;
  SLOTS.forEach((s, i) => {
    const c = i % 2, r = Math.floor(i / 2), x = sx + 40 + c * (cw + 20), yy = sy + 240 + r * 136;

}
const SCR = { x: 260, y: 560, w: 560, h: 560 * 1920 / 1080 };
function shotBox(t) { const k = io(seg(t, 16.4, 16.95)); return { x: lerp(0, SCR.x, k), y: lerp(0, SCR.y, k), w: lerp(W, SCR.w, k), h: lerp(H, SCR.h, k), k }; }
const SHARE = () => [SCR.x + 540 * SCR.w / W, SCR.y + 1760 * SCR.w / W];
function scene6(t) {
  const b = shotBox(t), sc = b.w / W;

  if (hw > 0.002) { ctx.save(); scaleAt(150, 1240, hw); ctx.rotate(-0.06); rr(40, 1140, 300, 120, 44); ctx.fillStyle = "#ffffff"; ctx.fill(); text("HOW?!", 190, 1202, 64, C.pink, 700, "center"); text("Anne", 64, 1116, 30, "#ffffff", 700); ctx.restore(); }

// ---------- scene 7 · 19.0-22.0 · logo (navy) ----------
const LP = {
  top1: new Path2D("M91 102h66l-14 31H62c-4 0-5-3-2-6l27-23c1-1 2-2 4-2Z"),
  top2: new Path2D("M164 102h56c2 0 3 1 4 2l29 24c3 3 1 5-3 5H150l14-31Z"),

  tr1: new Path2D("M143 76c17-23 38-31 68-29"),

const LG = { s: 1.35, x: (W - 690 * 1.35) / 2, y: 640 };
function scene7(t) {

  const t0 = 19.0;

// ---------- colour floods (each scene opens from the object that ends the last one) ----------
const SCENES = [
  { t: 0, fn: scene1 },
  { t: 3.0, fn: scene2, x: PHONE1[0], y: () => PHONE1[1], lead: C.pink },
  { t: 6.0, fn: scene3, x: 540, y: () => 1418, lead: C.violet },
  { t: 8.5, fn: scene4, x: 540, y: () => 840, lead: C.pink },
  { t: 11.5, fn: scene5, x: 640, y: () => 1230, lead: C.sun },
  { t: 14.5, fn: scene6, x: 540, y: () => 1330, lead: C.lime },
  { t: 19.0, fn: scene7, x: SHARE()[0], y: () => SHARE()[1], lead: C.blue },
];
const FD = 0.36;
function frame(t) {
  let k = 0; while (k + 1 < SCENES.length && SCENES[k + 1].t <= t) k++;
  const s = SCENES[k];
  if (k === 0 || t >= s.t + FD) { s.fn(t); return; }
  SCENES[k - 1].fn(t);
  const ox = s.x, oy = s.y(), far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - ox, y - oy))) * 1.05;
  const p = seg(t, s.t, s.t + FD), rLead = far * out3(seg(t, s.t, s.t + FD * 0.8)), r = far * io(p);
  ctx.fillStyle = s.lead; ctx.beginPath(); ctx.arc(ox, oy, rLead, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(ox, oy, r, 0, 7); ctx.clip(); s.fn(t); ctx.restore();
}
function camera(t) {
  let z = 1, sx = 0, sy = 0;
  for (const b of [3.0, 6.0, 8.5, 11.5, 14.5, 19.0]) if (t > b) z += 0.02 * Math.exp(-(t - b) * 6);
  if (t > 16.0) { const e = Math.exp(-(t - 16.0) * 7); z += 0.06 * e; sx = Math.sin(t * 61) * 14 * e; sy = Math.cos(t * 47) * 14 * e; }

  z += 0.04 * io(seg(t, 19.6, 22.0));                                // slow push on the end card (no frozen frame)

}
window.seek = async t => {
  t = clamp(t, 0, T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const [z, sx, sy] = camera(t);
  ctx.translate(540 + sx, 960 + sy); ctx.scale(z, z); ctx.translate(-540, -960);
  frame(t);
  document.getElementById("tc").textContent = t.toFixed(3);
};

// ---------- preview controls ----------
let now = 0, playing = false, last = 0;
function loop(ts) { if (playing) { now = (now + (ts - last) / 1000) % T; window.seek(now); } last = ts; requestAnimationFrame(loop); }
addEventListener("keydown", e => {
  if (e.code === "Space") { playing = !playing; e.preventDefault(); }
  if (e.code === "ArrowRight") { playing = false; now = Math.min(T, now + 1 / FPS); window.seek(now); }
  if (e.code === "ArrowLeft") { playing = false; now = Math.max(0, now - 1 / FPS); window.seek(now); }
  if (e.code === "KeyR") { now = 0; playing = true; }
});
Promise.all([document.fonts.load("700 40px SG"), document.fonts.load("500 40px SG")]).then(() => {
  const q = new URLSearchParams(location.search).get("t");
  now = q ? +q : 0; window.seek(now); window.ready = true; requestAnimationFrame(loop);
});
